on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Create release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: go

      - name: Push major and minor tags
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")

          git tag -f "v${MAJOR}" "${release_commit}"
          git tag -f "v${MAJOR}.${MINOR}" "${release_commit}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/v${MAJOR}" "refs/tags/v${MAJOR}.${MINOR}" --force
