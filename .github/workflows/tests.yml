name: tests

on:
  push:
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target base --tag yumsday:base .

      - name: Run tests
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/app"
          --workdir /app
          yumsday:base
          make test-cicd

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/coverage.out
            test/test-report.json
          if-no-files-found: ignore
