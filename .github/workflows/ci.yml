name: CI

on:
  push:
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE: ci-image

jobs:
  image:
    name: Build CI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export
        uses: docker/build-push-action@v7
        with:
          file: docker/ci.Dockerfile
          tags: ${{ env.IMAGE }}:latest
          outputs: type=docker,dest=${{ runner.temp }}/ci-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE }}
          path: ${{ runner.temp }}/${{ env.IMAGE }}.tar

  lint:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE }}
          path: ${{ runner.temp }}

      - name: Load CI image
        run: docker load --input ${{ runner.temp }}/${{ env.IMAGE }}.tar

      - name: lint
        run: docker run --rm ${{ env.IMAGE }} golangci-lint run

  test:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.IMAGE }}
          path: ${{ runner.temp }}

      - name: Load CI image
        run: docker load --input ${{ runner.temp }}/${{ env.IMAGE }}.tar

      - name: Run tests
        run: docker run --rm ${{ env.IMAGE }} make test-ci
